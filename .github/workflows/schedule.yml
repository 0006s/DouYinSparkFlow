# 本文件改自上游 schedule.yml，做了三处必要改动：
#
# 1) 去掉 toJson 聚合所有 secrets 的写法，改为逐个显式引用。
#    原因是「把整个 secrets 上下文聚合成一个变量」属于 GitHub 点名的
#    密钥外泄特征，非 fork 仓库不扫描，fork 仓库会被判 workflow file
#    may be malicious，结论固定 action_required，永远不执行。
#    功能等价：main.py 直接读环境变量，本来就不需要那步导出。
#
# 2) ubuntu-latest 已滚动到 26.04，而 playwright==1.58.0 不支持该系统，
#    安装浏览器会直接报 "Does not support chromium-headless-shell on
#    ubuntu26.04-x64"。因此固定到 ubuntu-24.04。
#
# 3) utils/config.py 里 DEBUG=True，core/browser.py 因此以 headless=False
#    启动；上游却只装 chromium-headless-shell，缺完整 chromium 会失败。
#    这里改为安装完整 chromium，并用 xvfb 提供虚拟显示。
name: DouYin Spark Flow Schedule Run

on:
  workflow_dispatch:        # 允许手动触发
  schedule:                 # 定时任务
    - cron: "40 16 * * *"   # 每天 16:40 UTC（北京时间次日 00:40）

jobs:
  run-main:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    environment: user-data
    env:
      PROXY_ADDRESS: ${{ vars.PROXY_ADDRESS }}
      MESSAGE_TEMPLATE: ${{ vars.MESSAGE_TEMPLATE }}
      HITOKOTO_TYPES: ${{ vars.HITOKOTO_TYPES }}
      MATCH_MODE: ${{ vars.MATCH_MODE }}
      BROWSER_TIMEOUT: ${{ vars.BROWSER_TIMEOUT }}
      FRIEND_LIST_WAIT_TIME: ${{ vars.FRIEND_LIST_WAIT_TIME }}
      TASK_RETRY_TIMES: ${{ vars.TASK_RETRY_TIMES }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      TASKS: ${{ vars.TASKS }}
      COOKIES_46028533140: ${{ secrets.COOKIES_46028533140 }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test Douyin Accessibility
        run: |
          curl -I https://creator.douyin.com/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure browsers are installed
        run: playwright install chromium --with-deps

      - name: Ensure xvfb
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Run DouYin Spark Flow
        run: xvfb-run -a python main.py

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: run-logs
          path: logs/
          if-no-files-found: warn

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
