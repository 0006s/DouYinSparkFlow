# 本文件改自上游 schedule.yml，只做了一处功能性改动：
#
# 上游用 toJson 把 vars 和 secrets 各自聚合成一整块 JSON，交给
# utils/export_github_env.py 落盘成 .env 与 GITHUB_ENV。
# 其中「把整个 secrets 上下文聚合进一个变量」这一步，是 GitHub 官方
# 点名的密钥外泄特征写法 —— 非 fork 仓库不做这项扫描，但 fork 出来的
# 仓库会被判定为 workflow file may be malicious，运行结论固定为
# action_required，也就是永远不执行、还必须人工点批准。
#
# 这里改为逐个显式引用。功能完全等价：main.py 直接读环境变量，
# 本来就不需要那步导出；顺带也免去了把全部密钥写进 .env 的副作用。
name: DouYin Spark Flow Schedule Run

on:
  workflow_dispatch:        # 允许手动触发
  schedule:                 # 定时任务
    - cron: "40 16 * * *"   # 每天 16:40 UTC（北京时间次日 00:40）

jobs:
  run-main:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: user-data
    env:
      PROXY_ADDRESS: ${{ vars.PROXY_ADDRESS }}
      MESSAGE_TEMPLATE: ${{ vars.MESSAGE_TEMPLATE }}
      HITOKOTO_TYPES: ${{ vars.HITOKOTO_TYPES }}
      MATCH_MODE: ${{ vars.MATCH_MODE }}
      BROWSER_TIMEOUT: ${{ vars.BROWSER_TIMEOUT }}
      FRIEND_LIST_WAIT_TIME: ${{ vars.FRIEND_LIST_WAIT_TIME }}
      TASK_RETRY_TIMES: ${{ vars.TASK_RETRY_TIMES }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      TASKS: ${{ vars.TASKS }}
      COOKIES_46028533140: ${{ secrets.COOKIES_46028533140 }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test Douyin Accessibility
        run: |
          curl -I https://creator.douyin.com/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure browsers are installed
        run: playwright install chromium --with-deps --only-shell

      - name: Run DouYin Spark Flow
        run: python main.py

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: run-logs
          path: logs/
          if-no-files-found: warn

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
